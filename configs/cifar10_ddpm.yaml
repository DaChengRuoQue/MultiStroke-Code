dataset: cifar10
image_size: 32
num_classes: 10
train_batch_size: 40
gradient_accumulation_steps: 1
learning_rate: 0.0002
weight_decay: 0.0
grad_clip: 1.0
max_train_steps: 100000
mixed_precision: "no"
num_workers: 4

num_train_timesteps: 100
beta_schedule: linear
beta_start: 0.0001
beta_end: 0.189
model_mean_type: eps
model_var_type: fixedlarge

unet_dropout: 0.0
multistroke_k_max: 2
checkpoint_interval: 20000
